name: Проверка проекта

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Выбрать проверки по изменениям, включая основную ветку
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--quick --browser --plan)
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            args=(--scope full --browser --plan)
          elif [ "$EVENT_NAME" = pull_request ]; then
            mapfile -d '' -t files < <(git diff --name-only -z "$PR_BASE_SHA...HEAD")
            args+=(--files "${files[@]}")
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            mapfile -d '' -t files < <(git diff --name-only -z "$BEFORE_SHA" HEAD)
            args+=(--files "${files[@]}")
          fi
          python3 -B scripts/check_all.py "${args[@]}" > "$RUNNER_TEMP/check-plan.json"
          python3 - "$RUNNER_TEMP/check-plan.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          for key, value in json.load(open(sys.argv[1])).items():
              if key != 'files':
                  print(f'{key}={str(value).lower()}')
          PY
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.browser == 'true'
        with:
          node-version: '22'
      - name: Проверить Python на ошибки и неиспользуемый код
        if: steps.plan.outputs.python == 'true'
        run: |
          python -m pip install -r scripts/ci/requirements.txt
          python -m ruff check scripts
      - name: Установить закреплённые Playwright и ESLint вне checkout
        if: steps.plan.outputs.browser == 'true'
        shell: bash
        run: |
          browser_env="$RUNNER_TEMP/alcemy-playwright"
          mkdir -p "$browser_env"
          cp scripts/ci/package.json scripts/ci/package-lock.json "$browser_env/"
          npm ci --prefix "$browser_env"
          "$browser_env/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$browser_env/node_modules" >> "$GITHUB_ENV"
          browser_path=$(NODE_PATH="$browser_env/node_modules" node -e "process.stdout.write(require('playwright').chromium.executablePath())")
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Проверить затронутую область
        if: steps.plan.outputs.automatic == 'true' && steps.plan.outputs.scope != 'full'
        env:
          CHECK_SCOPE: ${{ steps.plan.outputs.scope }}
        run: |
          python3 - "$RUNNER_TEMP/check-plan.json" "$CHECK_SCOPE" <<'PY'
          import json, subprocess, sys
          files = json.load(open(sys.argv[1]))['files']
          args = [sys.executable, '-B', 'scripts/check_all.py', '--scope', sys.argv[2], '--sources']
          if files is not None:
              args += ['--files', *files]
          raise SystemExit(subprocess.call(args))
          PY
      - name: Проверить полный выпуск
        if: steps.plan.outputs.scope == 'full'
        run: python3 -B scripts/check_all.py --sources --slow --browser

      - name: Отметить отсутствие автоматических проверок
        if: steps.plan.outputs.automatic != 'true'
        run: echo 'Автоматические проверки не выбраны; требуется ручная сверка текста. Это пропуск, а не успешный прогон тестов.' >> "$GITHUB_STEP_SUMMARY"

      - name: Сверить точный расчёт и Монте-Карло на сетке
        if: steps.plan.outputs.scope == 'full'
        run: python3 -B scripts/scenario_engine.py --grid --runs 10000
